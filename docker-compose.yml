services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      - MONGO_URI=mongodb://mongo:27017/atlas-spaces?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:-atlas-spaces-production-secret-key-2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Bogota}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
